<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 李维个人网站</title>
<style>
  :root{--bg:#070D18;--card:#101D30;--line:rgba(150,180,225,.14);--text:#E8EDF6;--muted:#8B9BB5;--accent:#F2B866;--ice:#8FC7FF;--danger:#ff6b6b;--ok:#51cf66}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  h1{font-size:24px;margin-bottom:20px;color:var(--accent)}
  h2{font-size:18px;margin:24px 0 12px;color:var(--ice);border-left:3px solid var(--accent);padding-left:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  input,textarea{width:100%;background:#0C1626;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;margin-bottom:10px}
  input:focus,textarea:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#221708;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
  button:hover{opacity:.9}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.danger{background:var(--danger);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;margin-right:4px}
  .tag.ok{background:rgba(81,207,102,.15);color:var(--ok)}
  .tag.wait{background:rgba(255,193,7,.15);color:#ffc107}
  #loginBox{max-width:380px;margin:100px auto}
  .hidden{display:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ 个人网站管理后台</h1>

  <div id="loginBox" class="card">
    <h2 style="margin-top:0">管理员登录</h2>
    <input id="username" placeholder="用户名" value="admin">
    <input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">登 录</button>
  </div>

  <div id="adminBox" class="hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <span style="color:var(--muted)">登录成功，欢迎！</span>
      <button class="ghost" onclick="logout()">退出</button>
    </div>

    <h2>📨 留言审核</h2>
    <div class="card"><table id="msgTable"><thead><tr><th>昵称</th><th>内容</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>

    <h2>➕ 新增项目</h2>
    <div class="card">
      <input id="pYear" placeholder="年份，如 2025">
      <input id="pTitle" placeholder="项目标题">
      <textarea id="pDesc" placeholder="项目描述" rows="2"></textarea>
      <input id="pTags" placeholder="技术标签（逗号分隔）">
      <button onclick="addProject()">添加项目</button>
    </div>

    <h2>📁 项目列表</h2>
    <div class="card"><table id="projTable"><thead><tr><th>年份</th><th>标题</th><th>操作</th></tr></thead><tbody></tbody></table></div>

    <h2>➕ 新增博客</h2>
    <div class="card">
      <input id="bDate" placeholder="日期，如 2026-10-29">
      <input id="bTitle" placeholder="博客标题">
      <textarea id="bSummary" placeholder="摘要" rows="2"></textarea>
      <button onclick="addBlog()">添加博客</button>
    </div>

    <h2>📝 博客列表</h2>
    <div class="card"><table id="blogTable"><thead><tr><th>日期</th><th>标题</th><th>操作</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
var API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://localhost:8010/api"
  : "https://1d5d385bb1de1602-123-244-168-18.serveousercontent.com/api";
var token = sessionStorage.getItem("admin_token") || "";

function toast(msg){ alert(msg); }

function login(){
  fetch(API + "/admin/login", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username: document.getElementById("username").value, password: document.getElementById("password").value})})
  .then(r=>r.json()).then(function(res){
    if(res.token){ token = res.token; sessionStorage.setItem("admin_token", token); showAdmin(); }
    else toast(res.detail || "登录失败");
  });
}

function logout(){ sessionStorage.removeItem("admin_token"); location.reload(); }

function authHeaders(){ return {"Content-Type":"application/json", "Authorization":"Bearer " + token}; }

function showAdmin(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
  loadMsgs(); loadProjects(); loadBlogs();
}

function loadMsgs(){
  fetch(API + "/admin/messages", {headers: authHeaders()}).then(r=>r.json()).then(function(list){
    var html = list.map(function(m){
      var status = m.approved ? '<span class="tag ok">已通过</span>' : '<span class="tag wait">待审核</span>';
      var ops = m.approved ? "" : '<button style="padding:4px 10px;font-size:12px" onclick="approveMsg('+m.id+')">通过</button> ';
      ops += '<button class="danger" style="padding:4px 10px;font-size:12px" onclick="delMsg('+m.id+')">删除</button>';
      return "<tr><td>"+esc(m.nickname)+"</td><td>"+esc(m.content)+"</td><td>"+esc(m.created_at)+"</td><td>"+status+"</td><td>"+ops+"</td></tr>";
    }).join("");
    document.querySelector("#msgTable tbody").innerHTML = html || '<tr><td colspan="5" style="color:var(--muted)">暂无留言</td></tr>';
  });
}

function approveMsg(id){ fetch(API+"/admin/messages/"+id+"/approve", {method:"POST", headers:authHeaders()}).then(loadMsgs); }
function delMsg(id){ if(confirm("确认删除？")) fetch(API+"/admin/messages/"+id, {method:"DELETE", headers:authHeaders()}).then(loadMsgs); }

function loadProjects(){
  fetch(API + "/projects").then(r=>r.json()).then(function(list){
    var html = list.map(function(p){
      return "<tr><td>"+esc(p.year)+"</td><td>"+esc(p.title)+"</td><td><button class='danger' style='padding:4px 10px;font-size:12px' onclick='delProject("+p.id+")'>删除</button></td></tr>";
    }).join("");
    document.querySelector("#projTable tbody").innerHTML = html;
  });
}

function addProject(){
  var body = {year: pYear.value, title: pTitle.value, description: pDesc.value, tags: pTags.value};
  fetch(API + "/admin/projects", {method:"POST", headers:authHeaders(), body:JSON.stringify(body)})
    .then(function(){ pYear.value=pTitle.value=pDesc.value=pTags.value=""; loadProjects(); toast("已添加"); });
}
function delProject(id){ if(confirm("确认删除？")) fetch(API+"/admin/projects/"+id, {method:"DELETE", headers:authHeaders()}).then(loadProjects); }

function loadBlogs(){
  fetch(API + "/blogs").then(r=>r.json()).then(function(list){
    var html = list.map(function(b){
      return "<tr><td>"+esc(b.date)+"</td><td>"+esc(b.title)+"</td><td><button class='danger' style='padding:4px 10px;font-size:12px' onclick='delBlog("+b.id+")'>删除</button></td></tr>";
    }).join("");
    document.querySelector("#blogTable tbody").innerHTML = html;
  });
}

function addBlog(){
  var body = {date: bDate.value, title: bTitle.value, summary: bSummary.value};
  fetch(API + "/admin/blogs", {method:"POST", headers:authHeaders(), body:JSON.stringify(body)})
    .then(function(){ bDate.value=bTitle.value=bSummary.value=""; loadBlogs(); toast("已添加"); });
}
function delBlog(id){ if(confirm("确认删除？")) fetch(API+"/admin/blogs/"+id, {method:"DELETE", headers:authHeaders()}).then(loadBlogs); }

function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

if(token) showAdmin();
</script>
</body>
</html>
